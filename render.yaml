services:
  - type: web
    name: phishshield-api
    runtime: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        value: "phishshield-production-secure-cluster-key-minimum-32chars"
      - key: CORS_ORIGINS
        value: "*"
