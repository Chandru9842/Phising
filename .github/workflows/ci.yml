name: PhishShield CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  ENVIRONMENT: test
  PROJECT_NAME: PhishShield
  DATABASE_URL: sqlite:///./test_phishshield.db
  PYTHONUNBUFFERED: "1"

jobs:
  backend-tests:
    name: Backend Pytest & AI Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies for OpenCV & EasyOCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Cache EasyOCR & Torch Model Weights
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR/model
          key: easyocr-models-v1-${{ runner.os }}
          restore-keys: |
            easyocr-models-v1-

      - name: Execute Backend Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Code-Splitting & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle with Vite
        run: |
          cd frontend
          npm run build

      - name: Verify Production Dist Output
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Frontend build successfully verified. Dist output structure valid."

  docker-lint:
    name: Docker & Containerfile Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Frontend Dockerfile Build
        run: |
          docker build -t phishshield-frontend:ci frontend/

      - name: Validate Backend Dockerfile Build
        run: |
          docker build -t phishshield-backend:ci backend/
